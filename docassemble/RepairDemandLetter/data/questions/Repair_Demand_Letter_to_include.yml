---
include:
  - docassemble.AssemblyLine:al_package.yml
  - docassemble.ALMassachusetts:al_massachusetts.yml
---
comment: |
  This contains metadata that will not be overwritten if this YAML file is included in another
  file. Each file gets its own key in the interview_metadata dictionary.
  Most keys are not currently used at runtime, other than "allowed courts".
code: |
  interview_metadata
  package_title
  if "allowed courts" not in interview_metadata.get("Repair_Demand_Letter", {}):
    interview_metadata.initializeObject("Repair_Demand_Letter")
    interview_metadata["Repair_Demand_Letter"].update({
      "al_weaver_version": "1.6.2",
      "generated on": "2022-03-31",
      "title": package_title,
      "short title": package_title,
      "description": "A letter of demand for relief under the Consumer Protection Act, Chapter 93A",
      "original_form": "https://www.masslegalhelp.org/sites/default/files/2025-04/Form%2010.Repair%20Demand%20Ltr%202025.pdf",
      "allowed courts": [
      ],
      "categories": [
      ],        
      "logic block variable": "interview_order_Repair_Demand_Letter",
      "attachment block variable": "Repair_Demand_Letter_attachment",
      "typical role": "na",
    })
  repair_metadata_ready = True
---
objects:
  - other_parties: ALPeopleList.using(ask_number=True,target_number=1)
  - users: ALPeopleList.using(ask_number=True,target_number=1)
---
#################### Interview order #####################
comment: |
  Controls order and branching logic for questions specific to this form
id: interview_order_Repair_Demand_Letter
code: |
  repair_metadata_ready
  allowed_courts = interview_metadata["Repair_Demand_Letter"]["allowed courts"]
  nav.set_section('review_Repair_Demand_Letter')
  user_role = 'na'
  repair_93a_scope_reviewed
  if not isinstance(users, ALPeopleList) or not isinstance(other_parties, ALPeopleList):
    repair_legacy_session
  users.gather()
  set_parts(subtitle=str(users))
  users[0].address.address
  other_parties.gather()
  set_progress(20)
  other_parties[0].address.address
  time_frame
  notification_date
  set_progress(40)
  if written_notification:
    letter_date
  tenant_repair_issue_description
  effect_of_conditions
  set_progress(60)
  amount
  interview_order_Repair_Demand_Letter = True
---
comment: |
  This question is used to introduce your interview. Please customize
id: Repair_Demand_Letter
continue button field: Repair_Demand_Letter_intro
question: |
  Repair Demand Letter
subquestion: |
  This interview will help you write a letter to your landlord asking them to pay you 
  because they did not fix a problem in your home, such as:
  
  - lack of heat,
  - mice or insects, 
  - or any other bad housing condition that is your landlord's responsibility.
  
  Chapter 93A gives your landlord 30 days to make a good-faith response.

  ${ collapse_template(help_93a_damages_explanation) }

  At the end of this interview you will get a letter that you need to deliver to your
  landlord.
---
template: help_93a_damages_explanation
subject: |
  What happens if my landlord ignores me?
content: |
  If your landlord: 
  
  - does not answer the letter, or
  - answers but does not offer to pay you a fair amount
  
  A court may award more than the amount of your loss in some cases.
  See the [Massachusetts Attorney General’s guide to a 30-day demand letter](https://www.mass.gov/info-details/30-day-demand-letter).
---
id: Chapter 93A housing scope
question: |
  Does the consumer protection law apply to your landlord?
subquestion: |
  Chapter 93A generally applies when a landlord is in the business of renting housing.
  This letter is for a private landlord. A city, state agency, or public housing authority is generally outside its scope.
  A rent voucher by itself does not make your landlord a government agency.

  Your private landlord is generally in the business of renting if either statement applies:

  * Your landlord lives in a different building.
  * Your building has at least five units.

  Other facts can matter, including whether your landlord rents out other property.
  If you are unsure, you can [find legal help](https://www.masslegalhelp.org/find-legal-help).
  You can also read the [Attorney General’s consumer protection guide](https://www.mass.gov/info-details/the-massachusetts-consumer-protection-law).
continue button field: repair_93a_scope_reviewed
---
id: old repair letter session
event: repair_legacy_session
question: |
  Start a new repair demand letter
subquestion: |
  This session was started in an older version. Start a new letter to use the current interview.
buttons:
  - Start over: restart
---
sets:
  - other_parties[i].name.first
  - other_parties[i].name.last
  - other_parties[i].name.middle
  - other_parties[i].name.suffix
id: names of opposing parties
question: |
  What is your landlord's name?
fields:
  - code: |
      other_parties[i].name_fields(person_or_business='unsure')
---
sets: 
  - other_parties[0].address.address
  - other_parties[0].address.city
id: What is the landlord s address
question: |
  What is your landlord's address?
fields:
  - code: |
      other_parties[0].address_fields(default_state="MA")
---
id: How long have you lived at the address
question: |
  When did you move in to ${ users[0].address.on_one_line() }?
subquestion: |
  State the best date that you know. You can say an exact date or an estimate, like
  "June of 2020".
fields:
  - Date you moved in: time_frame
---
id: When did you first notify the landlord of the bad conditions
question: |
  When did you first tell your landlord about the problem?
subquestion: |
  Use your best estimate if you do not remember the exact day.
fields:
  - Date you first told your landlord: notification_date
    datatype: date
    max: ${ today() }
  - Did you tell your landlord in writing?: written_notification
    datatype: yesnoradio
  - Date you first told your landlord in writing: letter_date
    datatype: date
    max: ${ today() }
    show if: written_notification
validation code: |
  if written_notification and date_difference(starting=notification_date, ending=letter_date).days < 0:
    validation_error("The written notice date must be on or after the first notice date.", field="letter_date")
---
id: Describe the repairs
question: |
  What needs to be repaired right now?
fields:
  -  Tell the landlord what needs to be fixed: tenant_repair_issue_description
     label above field: True
     input type: area
     rows: 4
---
id: How have the conditions affected you and your property
question: |
  How have the conditions affected you and your property?
subquestion: |
  ${ collapse_template(help_effect_of_conditions) }
fields:
  - Explain the effect on you: effect_of_conditions
    label above field: True
    input type: area
    rows: 3
---
template: help_effect_of_conditions
subject: |
  What can I say?
content: |
    Tell your landlord how the problems have hurt you. Use your own words.
    Include facts about:
    
    1. whether you were physically injured or uncomfortable
    1. any money you had to spend because of the problem
    1. how having the problems makes you feel (such as disgust, fear, lack of safety)
    
    Example: Last week my 4 year old son tripped over the hole in the floor.
    He scraped his knee and cried for 20 minutes. We don't feel safe in our home.
---
id: How much compensation would you like to claim from the landlord?
question: |
  What amount of money would be fair for your landlord to pay you?
subquestion: |
  The amount that you list here will be your "settlement offer".
fields:
  - Settlement offer amount: amount
    datatype: currency
    min: 0
---
code: |
  signature_fields = ['users[0].signature']
---
id: Repair Demand Letter review screen
event: review_Repair_Demand_Letter
question: |
  Review your answers
review:
  - Edit: other_parties[0].name.first
    button: |
      **Landlord**: ${ other_parties[0].name.full() }
  - Edit: other_parties[0].address.address
    button: |
      **Landlord’s address**: ${ other_parties[0].address.on_one_line() }
  - Edit: effect_of_conditions
    button: |
      **How the conditions affected you**:
      ${ effect_of_conditions }
  - Edit: notification_date
    button: |
      **When you first told your landlord**:
      ${ notification_date }
  - Edit: tenant_repair_issue_description
    button: |
      **What needs to be repaired**:
      ${ tenant_repair_issue_description }
  - Edit: amount
    button: |
      **Amount you are asking for**:
      ${ currency(amount) }
  - Edit: time_frame
    button: |
      **When you moved in**:
      ${ time_frame }
  - Edit: notification_date
    button: |
      **Written notice**: ${ letter_date if written_notification else "None" }
  - Edit: users[0].name.first
    button: |
      **Tenant**: ${ users[0].name.full() }
  - Edit: users[0].address.address
    button: |
      **Tenant’s address**: ${ users[0].address.on_one_line() }
---
objects:
  - Repair_Demand_Letter_post_interview_instructions: ALDocument.using(title="Instructions", filename="Repair_Demand_Letter_next_steps.docx", has_addendum=False, default_overflow_message=AL_DEFAULT_OVERFLOW_MESSAGE)
  - Repair_Demand_Letter_attachment: ALDocument.using(title="Repair Demand Letter", filename="Repair_Demand_Letter.docx", has_addendum=False, default_overflow_message=AL_DEFAULT_OVERFLOW_MESSAGE)
---
attachments:
  - name: Repair Demand Letter post interview instructions
    filename: Post-interview-instructions     
    variable name: Repair_Demand_Letter_post_interview_instructions[i]        
    skip undefined: True
    tagged pdf: True
    docx template file: Repair_Demand_Letter_next_steps.docx
  - name: Repair Demand Letter attachment
    filename: Repair_Demand_Letter.docx     
    variable name: Repair_Demand_Letter_attachment[i]
    skip undefined: True
    tagged pdf: True
    docx template file: Repair_Demand_Letter.docx
